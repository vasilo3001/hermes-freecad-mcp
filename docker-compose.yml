# FreeCAD MCP Server - Portainer Stack (Docker Hub pull)
#
# No build step — pulls the pre-built image from Docker Hub.
#
# Deploy:
#   Portainer → Stacks → Add stack → Name: freecad-mcp → paste this YAML
#
# Updates:
#   I push a new tag (e.g. v1.1) to Docker Hub.
#   Bump the image tag below and redeploy the stack.
#
# Requires:
#   - FreeCAD running on the desktop (192.168.1.177)
#     with the Hermes MCP workbench active (bridge on port 9876)
#   - Port 9876 open on the desktop's firewall
#
# Hermes connects via HTTP:
#   mcp_servers:
#     freecad:
#       url: "http://192.168.1.184:3111/mcp"
#
# Or via Tailscale (from other machines):
#   mcp_servers:
#     freecad:
#       url: "http://<tailscale-ip>:3111/mcp"

services:
  freecadmcp:
    image: vasilo30001/freecad-mcp:latest
    container_name: freecadmcp
    restart: unless-stopped
    ports:
      - "3111:8000"
    environment:
      # FreeCAD bridge on the desktop
      - FREECAD_HOST=192.168.1.177
      - FREECAD_PORT=9876
    networks:
      - homeserver_homeserver-net

networks:
  homeserver_homeserver-net:
    external: true
