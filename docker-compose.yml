# FreeCAD MCP Server - Portainer Stack
# Runs in HTTP (streamable) mode — multi-tenant, stateless
#
# Hermes connects via HTTP transport:
#   mcp_servers:
#     freecad:
#       url: "http://192.168.1.184:3111/mcp"
#
# Or via Tailscale (from other machines on the network):
#   mcp_servers:
#     freecad:
#       url: "http://<tailscale-ip>:3111/mcp"
#
# The container reaches FreeCAD on the host via host.docker.internal:9876
# (requires --add-host=host.docker.internal:host-gateway in Portainer)

services:
  freecadmcp:
    build:
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        ENV PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1
        RUN pip install --no-cache-dir 'mcp>=2.0.0'
        COPY mcp_server.py .
        EXPOSE 8000
        ENTRYPOINT ["python3", "mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8000"]
    image: freecad-mcp:latest
    container_name: freecadmcp
    restart: unless-stopped
    ports:
      - "3111:8000"  # host:container — exposed on LAN only (192.168.1.184:3111)
    environment:
      # FreeCAD bridge on the host (via host.docker.internal)
      - FREECAD_HOST=host.docker.internal
      - FREECAD_PORT=9876
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homeserver_homeserver-net  # reuse your existing network

networks:
  homeserver_homeserver-net:
    external: true
