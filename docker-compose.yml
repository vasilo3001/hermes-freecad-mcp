# FreeCAD MCP Server - Portainer Stack
# Runs in HTTP (streamable) mode — persistent, multi-agent access
#
# BEFORE DEPLOYING:
#   1. Clone this repo on the homeserver:
#      git clone git@github.com:vasilo3001/hermes-freecad-mcp.git /DATA/AppData/hermes-freecad-mcp
#   2. In Portainer: Stacks → Add stack → Name: freecad-mcp
#      → Paste the YAML below (or point to the cloned repo)
#   3. Make sure FreeCAD is running on the homeserver with
#      the Hermes MCP workbench active (bridge on port 9876)
#
# Hermes connects via HTTP:
#   mcp_servers:
#     freecad:
#       url: "http://192.168.1.184:3111/mcp"
#
# Or via Tailscale (from other machines):
#   mcp_servers:
#     freecad:
#       url: "http://<tailscale-ip>:3111/mcp"

services:
  freecadmcp:
    build:
      context: /DATA/AppData/hermes-freecad-mcp
      dockerfile: Dockerfile
    image: freecad-mcp:latest
    container_name: freecadmcp
    restart: unless-stopped
    ports:
      - "3111:8000"
    environment:
      # FreeCAD bridge on the host (via host.docker.internal)
      - FREECAD_HOST=host.docker.internal
      - FREECAD_PORT=9876
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homeserver_homeserver-net

networks:
  homeserver_homeserver-net:
    external: true
